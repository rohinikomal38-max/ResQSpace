
name: Python Tests

on:
  push:
    branches:
      - main
      - feature/connectivity
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/python-analysis/requirements.txt
          pip install pytest

      - name: Run Python tests
        run: python -m pytest backend/python-analysis -v
